[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line-too-long: legacy lines pending a reflow pass
    "SIM116", # column dispatch in Qt model data() reads better as if/elif chains
]

[tool.ruff.lint.flake8-bugbear]
# QModelIndex() default args are the canonical Qt model-override signature
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
